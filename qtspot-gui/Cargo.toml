[package]
name = "qtspot-gui"
version = "0.1.0"
authors = ["Cian Estella <cian@triarii.dev>", "YummierGravy"]
edition = "2024"
build = "build.rs"
description = "Fast and native Spotify client"
repository = "https://github.com/YummierGravy/qtspot"

[[bin]]
name = "qtspot"
path = "src/bin/spotix.rs"

[[bin]]
name = "qtspot-qt"
path = "src/bin/spotix-qt.rs"

[features]
default = ["cpal"]
cpal = ["spotix-core/cpal"]
cubeb = ["spotix-core/cubeb"]

[dependencies]
spotix-core = { path = "../spotix-core" }

# Common
crossbeam-channel = { version = "0.5.15" }
directories = "6.0.0"
env_logger = { version = "0.11.9" }
itertools = "0.14.0"
im = { version = "15.1.0", features = ["serde"] }
log = { version = "0.4.29" }
lru = "0.16.3"
parking_lot = { version = "0.12.5" }
platform-dirs = { version = "0.3.0" }
rand = { version = "0.10.0" }
regex = { version = "1.12.3" }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0.149" }
toml = "1.0.6"
threadpool = { version = "1.8.1" }
time = { version = "0.3.47", features = ["macros", "formatting"] }
time-humanize = { version = "0.1.3" }
ureq = { version = "3.2.0", features = ["json", "socks-proxy"] }
url = { version = "2.5.8" }
infer = "0.19.0"
tokio = { version = "1.50.0", features = ["rt", "time"] }
rspotify = { version = "0.16.1", features = ["cli"] }
maybe-async = "0.2.10"
async-trait = "0.1.89"
chrono = "0.4.44"
rspotify-http = "0.16.1"
librespot-core = "0.8.0"

# GUI
cxx = "1.0.190"
cxx-qt = "0.8.1"
cxx-qt-lib = { version = "0.8.1", features = ["qt_full"] }
open = { version = "5.3.3" }
sanitize_html = "0.10.0"
image = "0.25.10"
artem = "3.0.0"

[build-dependencies]
cxx-qt-build = { version = "0.8.1", features = ["link_qt_object_files"] }

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1.12" }
image = { version = "0.25.10" }

[package.metadata.bundle]
name = "qtspot"
identifier = "com.yummiergravy.qtspot"
icon = ["assets/logo.icns"]
version = "0.1.0"
resources = ["assets/fonts/spotify-mix"]
copyright = "Copyright (c) Cian Estella / YummierGravy 2026. All rights reserved."
category = "Music"
short_description = "Fast and native Spotify client"
long_description = """
Small and efficient graphical music player for the Spotify network.
"""
